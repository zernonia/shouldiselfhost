name: price-sweep
# Monthly: check every stored price still appears on its source page; open an issue with
# the suspects. Humans verify and PR the fix — every confirmed hike becomes content.
on:
  schedule:
    - cron: '10 5 1 * *' # 1st of the month, 05:10 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sweep pricing pages
        run: node scripts/price-sweep.mjs > /tmp/sweep.md
      - name: Open issue if anything suspect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/sweep.md ]; then
            gh issue create \
              --title "Price sweep $(date -u +%Y-%m): stored prices to re-verify" \
              --body-file /tmp/sweep.md
          else
            echo "all stored prices still present on their source pages"
          fi
