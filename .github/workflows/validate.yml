name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schema + referential + rubric validation
        run: npm run validate
      - name: Humans stay out of data/metrics (bot territory)
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- data/metrics/ || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::data/metrics/ is bot-written only. Touched: $CHANGED"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (prerenders every page from data/)
        run: npm run build
