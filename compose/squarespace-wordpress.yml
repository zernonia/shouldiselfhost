# WordPress — the site builder that runs half the web (replaces Squarespace).
# Keep auto-updates on and the plugin count low; the maintenance minutes in the verdict
# math assume you do.
services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "8086:80"
    volumes:
      - wp-data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -sfL http://localhost/wp-admin/install.php >/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s

  wordpress-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_DATABASE: wordpress
      MARIADB_ROOT_PASSWORD: root-changeme # throwaway test value
    volumes:
      - wp-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  wp-data:
  wp-db:
