# Uptime Kuma — self-hosted uptime monitoring (replaces UptimeRobot)
# Tested under protocol v1. Image ships its own HEALTHCHECK.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - kuma-data:/app/data

volumes:
  kuma-data:
