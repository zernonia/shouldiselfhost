# DocuSeal — document signing on sqlite; one container
services:
  docuseal:
    image: docuseal/docuseal:latest
    container_name: docuseal
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - docuseal-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 20s
volumes:
  docuseal-data:
