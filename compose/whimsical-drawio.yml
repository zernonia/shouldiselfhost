# draw.io — diagrams; stateless tomcat container
services:
  drawio:
    image: jgraph/drawio:latest
    container_name: drawio
    restart: unless-stopped
    ports:
      - "8093:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
